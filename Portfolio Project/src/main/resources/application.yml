spring:
  application:
    name: portfolio
  # Default profile = zero-setup local development with a file-based H2 database
  # (PostgreSQL compatibility mode so the same Flyway scripts run everywhere).
  # Production: SPRING_PROFILES_ACTIVE=prod (see application-prod.yml).
  datasource:
    url: jdbc:h2:file:./data/portfolio;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate        # schema is owned by Flyway; Hibernate only verifies it
    open-in-view: false
  jackson:
    default-property-inclusion: non_null
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 1h
          must-revalidate: true
          cache-public: true
  mvc:
    problemdetails:
      enabled: true

server:
  address: 127.0.0.1             # never bind to all interfaces; put a reverse proxy in front for public access
  port: 8080
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json,image/svg+xml
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: false            # overridden to true in the prod profile (TLS)
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

portfolio:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}            # min 12 chars; hashed in memory at startup
    password-hash: ${ADMIN_PASSWORD_HASH:}  # preferred: BCrypt hash
